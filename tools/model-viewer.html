<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizador de modelos — SinalizaAção</title>
<!--
  Ferramenta de desenvolvimento: confere os GLB gerados por tools/convert_models.py
  com o mesmo material usado no app (cores, padrões e animação das partes).
  Sirva a RAIZ do repositório (ex.: npx serve .) e abra /tools/model-viewer.html
  Parâmetros: ?names=abelha,urso  &t=1.3 (instante da animação)  &cell=320  &animate=1
-->
<style>
  body { margin: 0; background: #1d2128; color: #fff; font: 13px system-ui, sans-serif; }
  .label { position: absolute; padding: 2px 6px; background: #0008; border-radius: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from '../inclusiapp/src/lib/three.js';
import { createAnimalMaterial, PartAnimator } from '../inclusiapp/src/ar/animalMaterial.js';

const params = new URLSearchParams(location.search);
const names = (params.get('names') || 'abelha,elefante,iguana,onca,urso').split(',');
const cell = +(params.get('cell') || 300);
const time = +(params.get('t') || 0);
const animate = params.get('animate') === '1';
const views = [['frente', [0, 0.35, 1.9]], ['lado', [1.9, 0.35, 0]], ['cima', [0, 1.9, 0.01]], ['3/4', [1.25, 0.95, 1.3]]];
const W = cell * views.length, H = cell * names.length;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setScissorTest(true);

const loader = new THREE.GLTFLoader();
const entries = [];
for (const name of names) {
  const gltf = await loader.loadAsync(`../inclusiapp/assets/models/${name}.glb`);
  const root = gltf.scene;
  const info = root.children[0].userData;
  const materials = [];
  root.traverse((o) => {
    if (!o.isMesh) return;
    const transparent = o.material.name === 'asas';
    o.material = createAnimalMaterial({ parts: info.parts, pattern: transparent ? null : info.pattern,
      transparent, opacity: transparent ? 0.42 : 1 });
    materials.push(o.material);
  });
  const animator = new PartAnimator(info.parts, materials);
  animator.update(time);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a3039);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x5a4a3a, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(0.6, 1.4, 1.2);
  scene.add(sun);
  root.position.y = -0.3;
  scene.add(root);
  const grid = new THREE.GridHelper(1.6, 8, 0x55606e, 0x3a424d);
  grid.position.y = -0.3;
  scene.add(grid);
  entries.push({ name, scene, animator });
}

function draw() {
  entries.forEach(({ scene }, r) => views.forEach(([, pos], c) => {
    const cam = new THREE.PerspectiveCamera(32, 1, 0.01, 50);
    cam.position.set(...pos);
    cam.lookAt(0, -0.02, 0);
    const x = c * cell, y = H - (r + 1) * cell;
    renderer.setViewport(x, y, cell, cell);
    renderer.setScissor(x, y, cell, cell);
    renderer.render(scene, cam);
  }));
}
draw();
entries.forEach(({ name }, r) => views.forEach(([label], c) => {
  const d = document.createElement('div');
  d.className = 'label';
  d.textContent = `${name} — ${label}`;
  Object.assign(d.style, { left: `${c * cell + 6}px`, top: `${r * cell + 6}px` });
  document.body.appendChild(d);
}));
if (animate) {
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = clock.getDelta();
    entries.forEach(({ animator }) => animator.update(dt));
    draw();
  });
}
document.title = 'done';
</script>
</body>
</html>
